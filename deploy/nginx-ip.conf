map $http_upgrade $bazikhooneh_connection_upgrade {
    default upgrade;
    '' close;
}

map $request_uri $bazikhooneh_loggable_uri {
    ~^(?P<bazikhooneh_path>[^?]*)\?.*token= $bazikhooneh_path?[token_redacted];
    default $request_uri;
}

limit_req_zone $binary_remote_addr zone=bazikhooneh_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=bazikhooneh_auth:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=bazikhooneh_connections:10m;

log_format bazikhooneh_log '$remote_addr - $remote_user [$time_local] '
    '"$request_method $bazikhooneh_loggable_uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';

upstream bazikhooneh_asgi {
    server 127.0.0.1:8100;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name bazikhooneh.codelighthouse.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://bazikhooneh.codelighthouse.ir$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name bazikhooneh.codelighthouse.ir;
    access_log /var/log/nginx/bazikhooneh-access.log bazikhooneh_log;

    ssl_certificate /etc/letsencrypt/live/bazikhooneh.codelighthouse.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bazikhooneh.codelighthouse.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BaziKhoonehTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;
    client_max_body_size 1m;
    limit_req_status 429;
    limit_conn_status 429;

    location /static/ {
        alias /var/www/bazikhooneh-static/;
        access_log off;
        expires 7d;
    }

    location ~ ^/api/v1/accounts/(login|register|refresh|password-reset/) {
        limit_req zone=bazikhooneh_auth burst=10 nodelay;
        limit_conn bazikhooneh_connections 10;
        proxy_pass http://bazikhooneh_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=bazikhooneh_api burst=40 nodelay;
        limit_conn bazikhooneh_connections 20;
        proxy_pass http://bazikhooneh_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/ {
        limit_req zone=bazikhooneh_api burst=20 nodelay;
        proxy_pass http://bazikhooneh_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bazikhooneh_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /sfu/ {
        limit_req zone=bazikhooneh_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bazikhooneh_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://bazikhooneh_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bazikhooneh_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
