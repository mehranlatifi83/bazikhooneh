map $http_upgrade $bazikhooneh_connection_upgrade {
    default upgrade;
    '' close;
}

upstream bazikhooneh_asgi {
    server 127.0.0.1:8100;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 91.107.131.14;

    location / {
        return 301 https://91.107.131.14$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name 91.107.131.14;

    ssl_certificate /etc/letsencrypt/live/91.107.131.14/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/91.107.131.14/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BaziKhoonehTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;
    client_max_body_size 1m;

    location /static/ {
        alias /var/www/bazikhooneh-static/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://bazikhooneh_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bazikhooneh_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
}
