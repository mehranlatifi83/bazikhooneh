plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

configurations.configureEach {
    exclude group: 'androidx.datastore', module: 'datastore-jvm'
    exclude group: 'androidx.datastore', module: 'datastore-preferences-jvm'
}

def apiBaseUrl = project.findProperty('apiBaseUrl') ?: 'https://bazikhooneh.codelighthouse.ir'

android {
    namespace 'ir.codelighthouse.bazikhooneh'
    compileSdk 34

    defaultConfig {
        applicationId "ir.codelighthouse.bazikhooneh"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
        manifestPlaceholders = [usesCleartextTraffic: "false"]
        resourceConfigurations += ['en', 'fa']
    }
    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            manifestPlaceholders.usesCleartextTraffic = "true"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation('com.google.firebase:firebase-messaging') {
        exclude group: 'androidx.datastore', module: 'datastore-preferences'
        exclude group: 'androidx.datastore', module: 'datastore-preferences-jvm'
        exclude group: 'androidx.datastore', module: 'datastore'
        exclude group: 'androidx.datastore', module: 'datastore-jvm'
    }
    // AGP 8.2 selects the JVM variant of this KMP dependency transitively. The Android
    // artifact contains PreferenceDataStoreDelegateKt required by Firebase Installations.
    implementation 'androidx.datastore:datastore-preferences-android:1.1.7'
    implementation 'androidx.datastore:datastore-android:1.1.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Bundles libmediasoupclient and its matching libwebrtc build (m140). Keeping a
    // second WebRTC AAR would duplicate org.webrtc classes and native symbols.
    implementation 'io.github.crow-misia.libmediasoup-android:libmediasoup-android:0.21.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
