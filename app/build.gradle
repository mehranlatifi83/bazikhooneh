plugins {
    id 'com.android.application'
}

def apiBaseUrl = project.findProperty('apiBaseUrl') ?: 'https://91.107.131.14'

android {
    namespace 'ir.codelighthouse.bazikhooneh'
    compileSdk 34

    defaultConfig {
        applicationId "ir.codelighthouse.bazikhooneh"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
        manifestPlaceholders = [usesCleartextTraffic: "false"]
    }
    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            manifestPlaceholders.usesCleartextTraffic = "true"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.github.webrtc-sdk:android:144.7559.05'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
